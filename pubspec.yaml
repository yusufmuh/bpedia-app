name: bpedia_app
description: "Bpedia Demo: aplikasi belanja Bpedia dengan zona Hadiah Kelopak (Check-in Harian, Roda Sabtu, Misi Belanja). Pembangunan ulang clean-room."
publish_to: 'none'
version: 3.0.0+30

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  kelopak_hub:
    git:
      url: https://github.com/yusufmuh/bpedia-kelopak-hub.git
      ref: v3.0.0
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.4
  url_launcher: ^6.3.3
  web: ^1.1.1
  audioplayers: ^6.7.1
  appsflyer_sdk: ^7.0.4
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/
    - assets/icons3d/
    - assets/bipy/
    - assets/promo/
    - assets/catalog/
    - assets/catalog/img/
    - assets/catalog/hot/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-400.ttf
          weight: 400
        - asset: assets/fonts/Poppins-500.ttf
          weight: 500
        - asset: assets/fonts/Poppins-600.ttf
          weight: 600
        - asset: assets/fonts/Poppins-700.ttf
          weight: 700
        - asset: assets/fonts/Poppins-800.ttf
          weight: 800
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Italic-Variable.ttf
          style: italic

flutter_launcher_icons:
  image_path: assets/launcher/app_icon_preview_1024.png
  android: true
  ios: true
  adaptive_icon_foreground: assets/launcher/adaptive_fg_preview.png
  adaptive_icon_foreground_inset: 4
  adaptive_icon_background: "#FDE7EC"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: false

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/launcher/splash_logo_light.png
  color_dark: "#0F0E10"
  image_dark: assets/launcher/splash_logo_dark.png
  android_12:
    color: "#FFFFFF"
    image: assets/launcher/splash_android12_light.png
    color_dark: "#0F0E10"
    image_dark: assets/launcher/splash_android12_dark.png
  web: true
